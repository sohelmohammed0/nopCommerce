name: Nop-Commerce-CI-CD

on:
  push:
    branches:
      - develop

jobs:
  #----------------------------------------------------
  # ✅ JOB-1 → CHECKOUT
  #----------------------------------------------------
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


  #----------------------------------------------------
  # ✅ JOB-2 → SCA (SonarCloud Code Analysis)
  #----------------------------------------------------
  sca:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.100"

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        with:
          args: >
            -Dsonar.organization=sohel879879
            -Dsonar.projectKey=sohel879879_nopCommerce.git
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  #----------------------------------------------------
  # ✅ JOB-3 → BUILD DOCKER IMAGE
  #----------------------------------------------------
  docker_build:
    runs-on: ubuntu-latest
    needs: sca
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t nop-app:latest .

      # ✅ Save and upload image as artifact for Trivy scan
      - name: Save Docker image
        run: docker save -o nop-app.tar nop-app:latest

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: nop-app.tar


  #----------------------------------------------------
  # ✅ JOB-4 → TRIVY IMAGE SCAN (LOCAL IMAGE)
  #----------------------------------------------------
  trivy_scan:
    runs-on: ubuntu-latest
    needs: docker_build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: .

      - name: Load Docker image
        run: docker load -i nop-app.tar

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: nop-app:latest
          format: table
          output: trivy-report.txt
          exit-code: 0           # set to 1 to fail on critical vulns
          ignore-unfixed: true

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-report
          path: trivy-report.txt


  #----------------------------------------------------
  # ✅ JOB-5 → PUSH IMAGE TO ECR & DEPLOY TO EKS
  #----------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: trivy_scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ✅ Download and load the same image for push
      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: .

      - name: Load Docker image
        run: docker load -i nop-app.tar

      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: dotnet             # ✅ your actual ECR repo name
          IMAGE_TAG: latest
        run: |
          docker tag nop-app:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "✅ Image pushed to ECR: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Configure kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region ap-south-1 --name ${{ secrets.EKS_CLUSTER_NAME }}
          kubectl get nodes

      - name: Deploy to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: dotnet
          IMAGE_TAG: latest
        run: |
          kubectl set image deployment/nop-deployment nop-container=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG --record
          kubectl rollout status deployment/nop-deployment
          kubectl get pods -o wide
