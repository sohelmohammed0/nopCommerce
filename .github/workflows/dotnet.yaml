name: Nop-Commerce-Build-Test-Deploy

on:
  push:
    branches:
      - develop

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:

    #-------------------- CHECKOUT CODE --------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    #-------------------- INSTALL DOTNET --------------------
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "9.0.100"

    #-------------------- DOTNET PUBLISH --------------------
    - name: Publish .NET
      run: dotnet publish -c Release src/Presentation/Nop.Web/Nop.Web.csproj -o demo

    #-------------------- SONAR SCAN --------------------
    - name: SonarQube Scan
      uses: SonarSource/sonarcloud-github-action@v3
      with:
        args: >
          -Dsonar.organization=sohel879879
          -Dsonar.projectKey=sohel879879_nopCommerce
          -Dsonar.host.url=https://sonarcloud.io
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    #-------------------- CONFIGURE AWS --------------------
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    #-------------------- LOGIN TO ECR --------------------
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    #-------------------- BUILD + PUSH DOCKER IMAGE --------------------
    - name: Build & Push Docker Image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: dev/nop
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    #-------------------- UPDATE KUBECONFIG --------------------
    - name: Setup kubeconfig
      run: |
        aws eks update-kubeconfig --region ap-south-1 --name ${{ secrets.EKS_CLUSTER_NAME }}

    #-------------------- DEPLOY TO EKS --------------------
    - name: Deploy to EKS
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: dev/nop
        IMAGE_TAG: latest
      run: |
        kubectl set image deployment/nop-deployment nop-container=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        kubectl rollout status deployment/nop-deployment
