name: Nop-Commerce-CI-CD

on:
  push:
    branches:
      - develop

jobs:
  #----------------------------------------------------
  # ✅ JOB-1 → CHECKOUT
  #----------------------------------------------------
  checkout:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


  #----------------------------------------------------
  # ✅ JOB-2 → SCA (SonarCloud)
  #----------------------------------------------------
  sca:
    runs-on: ubuntu-latest
    needs: checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.100"

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@v3
        with:
          args: >
            -Dsonar.organization=sohel879879
            -Dsonar.projectKey=sohel879879_nopCommerce.git
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  #----------------------------------------------------
  # ✅ JOB-3 → DOCKER IMAGE BUILD
  #----------------------------------------------------
  docker_build:
    runs-on: ubuntu-latest
    needs: sca

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Build Docker Image
        run: |
          docker build -t nop-app:latest .
    #----------------------------------------------------
  # ✅ JOB-4 → TRIVY IMAGE SCAN (with report output)
  #----------------------------------------------------
  trivy_scan:
    runs-on: ubuntu-latest
    needs: docker_build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: nop-app:latest
          format: table
          output: trivy-report.txt    # ✅ Save results to file
          exit-code: 0                # change to 1 to fail on high vulns
          ignore-unfixed: true

      - name: Upload Trivy Scan Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-report
          path: trivy-report.txt
  #----------------------------------------------------
  # ✅ JOB-5 → PUSH TO ECR & DEPLOY TO EKS
  #----------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: trivy_scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: dev/nop
          IMAGE_TAG: latest
        run: |
          docker tag nop-app:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Configure kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region ap-south-1 --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Deploy to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: dev/nop
          IMAGE_TAG: latest
        run: |
          kubectl set image deployment/nop-deployment nop-container=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          kubectl rollout status deployment/nop-deployment
  