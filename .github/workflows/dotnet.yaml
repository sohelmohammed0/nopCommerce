name: Nop-Commerce-CI-CD

on:
  push:
    branches:
      - develop

jobs:
  checkout:
    runs-on: ubuntu-latest

    steps:
      #-------------------- CHECKOUT CODE --------------------
      - name: Checkout repository
        uses: actions/checkout@v4

  sca:
    runs-on: ubuntu-latest
    needs: checkout

    steps:

      #-------------------- CHECKOUT CODE --------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      #-------------------- INSTALL DOTNET --------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.100"

      #-------------------- SONAR SCAN --------------------
      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@v3
        with:
          args: >
            -Dsonar.organization=sohel879879
            -Dsonar.projectKey=sohel879879_nopCommerce.git
            -Dsonar.host.url=https://sonarcloud.io
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      #-------------------- TRIVY SCAN (SCA) --------------------
      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          format: table
          exit-code: 0
          ignore-unfixed: true
